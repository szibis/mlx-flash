name: OpenAI API contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openai-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install model-free contract dependencies
        run: python -m pip install pytest numpy psutil tabulate pyyaml
      - name: HTTP, schema, malformed input, retry, cache and setup regression
        run: >-
          python -m pytest
          tests/test_openai_compat.py tests/test_serve_openai_compat.py
          tests/test_generation_measurements.py tests/test_serve_prompt_reuse.py
          tests/test_local_runtime.py tests/test_make_setup.py tests/test_verify_openai_api.py
          -v --junitxml=contract-results.xml
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: openai-contract-py${{ matrix.python }}
          path: contract-results.xml
          retention-days: 14
