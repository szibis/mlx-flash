name: Auto-Tag Release

# Release labels opt in; both package versions must be pre-bumped in the PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-tag:
    name: Tag the tested current main commit
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm CI tested current main and select merged PR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo 'Newer main commit exists; skipping stale CI result.'
            exit 0
          fi
          gh api "repos/$REPOSITORY/commits/$TESTED_SHA/pulls?per_page=100" > /tmp/release-prs.json
          # Listing succeeds even if the repository has no published releases.
          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" > /tmp/releases.json
          LATEST=$(python scripts/release_metadata.py latest --releases /tmp/releases.json)
          python scripts/release_metadata.py plan --prs /tmp/release-prs.json --sha "$TESTED_SHA" --latest "$LATEST" >> "$GITHUB_OUTPUT"
      - name: Create tag, or resume an existing tag at the same tested commit
        id: tag
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$CURRENT_SHA" = "$TESTED_SHA" ] || { echo 'Main changed; skipping.'; exit 0; }
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [ "$(git rev-list -n 1 "$TAG")" = "$TESTED_SHA" ] || { echo 'Tag already points to another commit'; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$TESTED_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  release:
    needs: auto-tag
    if: needs.auto-tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.auto-tag.outputs.tag }}
    secrets: inherit
